name: Update history and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pension-history-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate official results
        id: refresh
        continue-on-error: true
        run: node scripts/update-server-history.mjs
      - name: Verify last known good history and logic
        run: node --test tests/*.test.mjs
      - name: Persist last known good data and collection status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/sync-status.json public/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official draw history and collection status"
            git push
          fi
      - name: Prepare public data only
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish HTTPS data
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failure after preserving last good data
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Official source refresh failed. Last valid data remains available; next scheduled run retries."
          exit 1
